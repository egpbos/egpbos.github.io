title: egpBos.nl
description: "Patrick Bos' website: research software, data science, and things I'm still figuring out."
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://egpbos.nl" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: egpbos
# github_username:  egpbos
# linkedin_username: egpbos

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-sitemap

remote_theme: jekyll/minima

# Default front matter values. Pages and posts without their own `image`
# inherit this site-wide Open Graph image (used by jekyll-seo-tag).
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.jpg
        width: 1200
        height: 630
        alt: "Patrick Bos"

# Minima specific settings, which are only available from Minima 3.0 onward.
minima:
  nav_pages:
    - work.markdown
    - blog.markdown
    - about.markdown
  skin: classic
  social_links:
  - title: GitHub profile
    icon: github
    url: "https://github.com/egpbos"
  - title: Google Scholar profile
    icon: google-scholar
    url: "https://scholar.google.com/citations?user=3Le2IcUAAAAJ"
  - title: LinkedIn profile
    icon: linkedin
    url: "https://www.linkedin.com/in/egpbos"
  - title: Stack Overflow profile
    icon: stack-overflow
    url: "https://stackoverflow.com/users/1199693/egpbos"
