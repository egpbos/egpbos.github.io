name: Site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: jekyll/jekyll:pages
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        run: |
          cat > _ci_whitelist.yml <<'EOF'
          whitelist:
            - jekyll-feed
            - jekyll-remote-theme
            - jekyll-seo-tag
            - jekyll-sitemap
            - jekyll-github-metadata
          EOF
          jekyll build --safe --config _config.yml,_ci_whitelist.yml

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `_site` is gitignored, so reuse the output of the build job instead of
      # checking a stale local copy.
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - name: Lychee link check
        # Informational for now: report dead links without failing the workflow.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--verbose --no-progress --exclude \"^mailto:\" --accept \"200..=299,403,429,999\" --root-dir ${{ github.workspace }}/_site ${{ github.workspace }}/_site"
          output: lychee/out.md
          jobSummary: true